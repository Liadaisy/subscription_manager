    // --- REUSABLE BADGE ---
    function Badge({ status, label, size = 'sm' }) {
      const s = (status || '').toLowerCase();
      let color = 'bg-slate-100 text-slate-700 border-slate-200';
      let dot = 'bg-slate-400';

      if (['active', 'paid', 'completed', 'accepted'].includes(s)) {
        color = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        dot = 'bg-emerald-500';
      } else if (['paused', 'pending'].includes(s)) {
        color = 'bg-amber-50 text-amber-700 border-amber-200';
        dot = 'bg-amber-500';
      } else if (['overdue', 'expired', 'delinquent'].includes(s)) {
        color = 'bg-rose-50 text-rose-700 border-rose-200 font-bold';
        dot = 'bg-rose-500';
      } else if (['unpaid', 'sent'].includes(s)) {
        color = 'bg-blue-50 text-blue-700 border-blue-200';
        dot = 'bg-blue-500';
      }

      return (
        <span className={`inline-flex items-center gap-1.5 font-medium rounded-full border ${color} ${size === 'xs' ? 'px-2 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs'}`}>
          <span className={`h-1.5 w-1.5 rounded-full ${dot}`}></span>
          {label || status}
        </span>
      );
    }

    // --- SVG CHARTS FOR TOTAL DEPENDENCY INDEPENDENCE ---
    function RevenueChart({ data }) {
      // Points for SVG Area
      const points = [
        { month: 'May', val: 14200 },
        { month: 'Jun', val: 19800 },
        { month: 'Jul', val: 21500 },
        { month: 'Aug', val: 24900 },
        { month: 'Sep', val: 28400 },
        { month: 'Oct', val: 34850 }
      ];
      const maxVal = 40000;
      const height = 180;
      const width = 500;

      const pathCoords = points.map((p, i) => {
        const x = (i / (points.length - 1)) * (width - 40) + 20;
        const y = height - (p.val / maxVal) * (height - 30) - 10;
        return `${x},${y}`;
      }).join(' L ');

      const areaCoords = `M 20,${height} L ${pathCoords} L ${width - 20},${height} Z`;

      return (
        <div className="w-full">
          <svg viewBox={`0 0 ${width} ${height + 30}`} className="w-full h-48 overflow-visible">
            <defs>
              <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#6366F1" stopOpacity="0.3" />
                <stop offset="100%" stopColor="#6366F1" stopOpacity="0.0" />
              </linearGradient>
            </defs>

            {/* Horizontal Grid lines */}
            {[0, 10000, 20000, 30000, 40000].map((v, idx) => {
              const y = height - (v / maxVal) * (height - 30) - 10;
              return (
                <g key={idx}>
                  <line x1="20" y1={y} x2={width - 20} y2={y} stroke="#f1f5f9" strokeWidth="1" strokeDasharray="3 3" />
                  <text x="2" y={y + 4} fontSize="9" fill="#94a3b8">${v / 1000}k</text>
                </g>
              );
            })}

            {/* Gradient Fill & Stroke */}
            <path d={areaCoords} fill="url(#chartGrad)" />
            <path d={`M ${pathCoords}`} fill="none" stroke="#4F46E5" strokeWidth="3" strokeLinecap="round" />

            {/* Dots & Labels */}
            {points.map((p, i) => {
              const x = (i / (points.length - 1)) * (width - 40) + 20;
              const y = height - (p.val / maxVal) * (height - 30) - 10;
              return (
                <g key={i} className="group cursor-pointer">
                  <circle cx={x} cy={y} r="4" fill="#4F46E5" stroke="#fff" strokeWidth="2" />
                  <text x={x} y={height + 18} fontSize="11" textAnchor="middle" fill="#64748b" fontWeight="600">
                    {p.month}
                  </text>
                  <text x={x} y={y - 8} fontSize="10" textAnchor="middle" fill="#1e1b4b" fontWeight="bold">
                    ${(p.val / 1000).toFixed(1)}k
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

      const handleAddSubscription = (subForm) => {
        const newSubId = `SUB-${1000 + data.subscriptions.length + 1}`;
        const newSub = {
          id: newSubId,
          status: 'Active',
          ...subForm
        };

        // Auto-generate invoice
        const taxRate = 10;
        const subtotal = Number(newSub.amount);
        const taxAmt = (subtotal * taxRate) / 100;
        const total = subtotal + taxAmt;
        const due = new Date();
        due.setDate(due.getDate() + 14);

        const newInv = {
          id: `INV-2026-00${data.invoices.length + 1}`,
          subscriptionId: newSubId,
          customerId: newSub.customerId,
          customerName: newSub.customerName,
          customerCompany: newSub.customerCompany,
          customerEmail: newSub.customerEmail,
          customerAddress: newSub.customerAddress || 'Address on file',
          items: [{ description: `${newSub.planName} (${newSub.billingCycle})`, quantity: 1, unitPrice: subtotal, amount: subtotal }],
          subtotal,
          taxRate,
          taxAmount: taxAmt,
          discountAmount: 0,
          totalAmount: total,
          paidAmount: 0,
          issueDate: newSub.startDate,
          dueDate: due.toISOString().split('T')[0],
          status: 'Unpaid',
          paymentMethod: 'Pending',
          notes: 'Standard renewal invoice generated on subscription creation.'
        };

        setData(prev => ({
          ...prev,
          subscriptions: [newSub, ...prev.subscriptions],
          invoices: [newInv, ...prev.invoices]
        }));

        setCreateSubOpen(false);
        showToast(`Subscription ${newSubId} activated! Invoice ${newInv.id} issued.`);

      // CRUD: Payment Recording
      const handleRecordPayment = (payForm) => {
        const payId = `PAY-${9000 + data.payments.length + 1}`;
        const newPay = {
          id: payId,
          status: 'Completed',
          isDemo: true,
          paymentDate: new Date().toISOString().split('T')[0],
          ...payForm
        };

        const updatedInvoices = data.invoices.map(inv => {
          if (inv.id === payForm.invoiceId) {
            return { ...inv, status: 'Paid', paidAmount: payForm.amount, paymentMethod: payForm.paymentMethod };
          }
          return inv;
        });

        // If sub was overdue, restore to active
        const targetInv = data.invoices.find(i => i.id === payForm.invoiceId);
        let updatedSubs = data.subscriptions;
        if (targetInv && targetInv.subscriptionId) {
          updatedSubs = data.subscriptions.map(s => s.id === targetInv.subscriptionId ? { ...s, status: 'Active' } : s);
        }

        setData(prev => ({
          ...prev,
          payments: [newPay, ...prev.payments],
          invoices: updatedInvoices,

      // Convert Quotation

        const quote = data.quotations.find(q => q.id === quoteId);

            company: quote.customerCompany,
            email: quote.customerEmail,

            address: 'Verified Office Address',
            totalSpent: 0,
            status: 'Active'

          setData(prev => ({ ...prev, customers: [cust, ...prev.customers] }));

          customerCompany: cust.company,
          customerEmail: cust.email,

                      <div className="flex justify-between text-slate-600">
                        <span>Tax ({previewInvoice.taxRate || 10}%):</span>
                        <span className="font-semibold text-slate-800">${Number(previewInvoice.taxAmount || 0).toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between text-base font-black text-navy-900 pt-2 border-t border-slate-200">
                        <span>Grand Total:</span>
                        <span className="text-brand-600">${Number(previewInvoice.totalAmount).toFixed(2)}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* CREATE/EDIT PLAN MODAL */}
          {createPlanModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-md p-6">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="text-base font-bold text-navy-900">{editingPlan ? 'Edit Plan' : 'Create Subscription Tier'}</h3>
                  <button onClick={() => setCreatePlanModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    handleSavePlan({
                      name: form.name.value,
                      price: Number(form.price.value),
                      yearlyPrice: Number(form.yearlyPrice.value),
                      cycle: 'Monthly',
                      features: ['Up to 15 Members', '100 GB Cloud Storage', 'Full Automation']
                    });
                  }}
                  className="space-y-4 mt-4 text-xs"
                >
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tier Name</label>
                    <input
                      type="text"
                      name="name"
                      defaultValue={editingPlan?.name || ''}
                      placeholder="e.g. Scale Pro"
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-medium"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Monthly Price ($)</label>
                      <input
                        type="number"
                        name="price"
                        defaultValue={editingPlan?.price || 89}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-medium"
                        required
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Annual Price ($)</label>
                      <input
                        type="number"
                        name="yearlyPrice"
                        defaultValue={editingPlan?.yearlyPrice || 890}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-medium"
                        required
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onClick={() => setCreatePlanModal(false)} className="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 font-semibold">
                      Cancel
                    </button>
                    <button type="submit" className="px-5 py-2 rounded-lg bg-brand-600 text-white font-bold hover:bg-brand-700 shadow-xs">
                      Save Tier
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
